<div class="tela">
  <header class="topo">
    @if (voltarPara(); as destino) {
      <a class="voltar" [routerLink]="destino">
        <app-icone nome="seta-esquerda" />
        {{ rotuloVoltar() }}
      </a>
    }
    <p class="marca" [class.marca-direita]="voltarPara()">
      <strong>Banco de Alimentos</strong>
      <span>do Recife</span>
    </p>

    <!-- Só aparece no desktop (o CSS esconde no celular). -->
    <div class="topo-direita">
      <nav class="navegacao" aria-label="Principal">
        <a routerLink="/" [class.ativo]="secao() === 'inicio'" [attr.aria-current]="secao() === 'inicio' ? 'page' : null">
          Início
        </a>
        <a
          routerLink="/quero-ajudar"
          [class.ativo]="secao() === 'ajudar'"
          [attr.aria-current]="secao() === 'ajudar' ? 'page' : null"
        >
          Quero ajudar
        </a>
        <a
          routerLink="/preciso-de-alimento"
          [class.ativo]="secao() === 'alimento'"
          [attr.aria-current]="secao() === 'alimento' ? 'page' : null"
        >
          Preciso de alimento
        </a>
      </nav>
      @if (leitura.disponivel) {
        <button type="button" class="ouvir" (click)="ouvir()">
          <app-icone nome="som" />
          Ouvir
        </button>
      }
    </div>
  </header>

  <main class="conteudo">
    <ng-content select="[acima-do-titulo]" />

    <h1 #tituloTela id="titulo-tela" class="titulo" tabindex="-1">{{ titulo() }}</h1>

    <!-- No desktop o botão "Ouvir" fica no topo; este some. -->
    @if (leitura.disponivel) {
      <button type="button" class="ouvir ouvir-celular" (click)="ouvir()">
        <app-icone nome="som" />
        Ouvir
      </button>
    }

    <ng-content />
  </main>
</div>
